version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smca-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smca"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./server
    container_name: smca-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smca
      PORT: 4000
      # Comma-separated list of allowed frontend origins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Shared secret for bearer token auth — set this in .env
      API_SECRET: ${API_SECRET:-changeme-local-dev}
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_API_SECRET: ${API_SECRET:-changeme-local-dev}
    container_name: smca-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_API_SECRET: ${API_SECRET:-changeme-local-dev}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
